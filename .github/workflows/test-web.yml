name: Test Web

on:
  pull_request:
    branches: [main, dev]
    paths:
      - src/**
      - api/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig*.json
      - vite.config.ts
      - vitest.config.ts
      - .github/workflows/test-web.yml
  workflow_dispatch:

jobs:
  test:
    name: Type-check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Nothing here touches a shared resource — no database, no deploy — so a
    # superseded run on the same ref is pure waste. Cancel it. (Contrast
    # rally-api's db-tests job, which must NOT cancel: killing it mid-pytest
    # leaves the shared dev database holding a transaction.)
    concurrency:
      group: test-web-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/lib/supabase.ts throws at IMPORT time when VITE_SUPABASE_URL or
      # VITE_SUPABASE_ANON_KEY is missing, and vitest runs through the Vite
      # pipeline, so every test file that transitively imports it would die on a
      # runner with no .env. These are deliberately throwaway values, not
      # secrets: no test reaches a real Supabase project (they mock the client),
      # and the URL only has to parse. Do NOT wire real credentials in here — a
      # pull_request run can come from a fork.
      - name: Write a throwaway .env
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=https://ci.example.supabase.co
          VITE_SUPABASE_ANON_KEY=ci-anon-key-not-a-secret
          VITE_API_BASE_URL=http://localhost:8000
          EOF

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Unit tests
        run: npx vitest run
